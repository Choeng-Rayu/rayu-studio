services:
  app-prod:
    image: rayu-ai:production
    build:
      context: .
      dockerfile: Dockerfile
      target: rayu-ai-production
      args:
        VITE_RAYU_BACKEND_URL: ${VITE_RAYU_BACKEND_URL:-}
        VITE_LOG_LEVEL: ${VITE_LOG_LEVEL:-info}
    ports:
      - '5173:5173'
    # Infrastructure settings only; users connect providers through Studio.
    env_file:
      - '.env'
      - '.env.local'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: pnpm run dockerstart
    profiles:
      - production

  app-dev:
    image: rayu-ai:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        VITE_RAYU_BACKEND_URL: ${VITE_RAYU_BACKEND_URL:-}
    # Infrastructure settings only; users connect providers through Studio.
    env_file:
      - '.env'
      - '.env.local'
    environment:
      - NODE_ENV=development
      - VITE_HMR_PROTOCOL=ws
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=5173
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - /app/node_modules
    ports:
      - '5173:5173'
    command: pnpm run dev --host 0.0.0.0
    profiles: ['development', 'default']

  app-prebuild:
    image: ghcr.io/rayucode/rayu-studio:latest
    env_file:
      - '.env'
      - '.env.local'
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: pnpm run dockerstart
    profiles:
      - prebuilt
